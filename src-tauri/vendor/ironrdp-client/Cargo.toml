# Vendored from IronRDP at rev a8da54ba4d849370bc92e1d5230cc18e99cf5ff1 with these changes, each
# marked "Reach:" in src/rdp.rs: DISPLAY_CONTROL_READY_TIMEOUT raised from 3 s
# to 6 s; a resize to the current size is skipped, and a graphics reset
# completes a pending resize; RDPDR drives carry the client name instead of
# "IronRDP"; the sound channel is announced initialized and encrypted
# (RdpsndAnnounced); ConfigBuilder::with_egfx_thin_client announces the
# graphics pipeline as a thin client, keeping the server to the older codecs
# (EgfxHandler); audio::set_muted drops the remote audio while the app is
# muted. Path dependencies
# were rewritten to the same git rev and workspace fields filled in.
[package]
name = "ironrdp-client"
version = "0.1.0"
readme = "README.md"
description = "Portable RDP client engine without GPU acceleration"
edition = "2024"
license = "MIT OR Apache-2.0"
homepage = "https://github.com/Devolutions/IronRDP"
repository = "https://github.com/Devolutions/IronRDP"
authors = ["Devolutions Inc. <infos@devolutions.net>", "Teleport <goteleport.com>"]
keywords = ["rdp", "remote-desktop", "network", "client", "protocol"]
categories = ["network-programming"]

[lib]
doctest = false
test = false

[features]
default = []

# Internal (PRIVATE!) feature used to expose helpers to the shared integration tests.
# Don't rely on this whatsoever. It may disappear at any time.
__test = []

rustls = [
    "ironrdp-tls/rustls",
    "tokio-tungstenite/rustls-tls-native-roots",
    "ironrdp-mstsgu?/rustls",
    "reqwest?/rustls-tls-native-roots-no-provider",
]

native-tls = [
    "ironrdp-tls/native-tls",
    "tokio-tungstenite/native-tls",
    "ironrdp-mstsgu?/native-tls",
    "reqwest?/native-tls",
]

sound = [
    "dep:ironrdp-rdpsnd",
    "dep:ironrdp-rdpsnd-native",
    "ironrdp-rdpsnd-native/capture",
    "dep:ironrdp-rdpeai",
]
clipboard = ["dep:ironrdp-cliprdr", "dep:ironrdp-cliprdr-native"]
rdpdr = ["dep:ironrdp-rdpdr", "dep:ironrdp-rdpsnd"]
smartcard = ["rdpdr"]
gateway = ["dep:ironrdp-mstsgu"]
remote-guard = ["ironrdp-connector/remote-guard", "ironrdp-tokio/remote-guard"]
qoi = ["ironrdp-connector/qoi", "ironrdp-session/qoi"]
qoiz = ["ironrdp-connector/qoiz", "ironrdp-session/qoiz"]
dvc-pipe-proxy = ["dep:ironrdp-dvc-pipe-proxy"]
dvc-com-plugin = ["dep:ironrdp-dvc-com-plugin"]
# Prefer System32\webauthn.dll via the DVC COM plugin host (MSTSC parity / hash-only hosts).
# Keep the pure-Rust RDPEWA path as a fallback when the COM plugin is unavailable.
webauthn = ["dep:ironrdp-rdpewa", "dep:ironrdp-rdpewa-native", "dvc-com-plugin"]
vmconnect = ["dep:ironrdp-vmconnect"]
location = ["dep:ironrdp-rdpel"]
# MS-RDPET connection telemetry: reports graphics pipeline milestones to the server.
telemetry = ["dep:ironrdp-rdpet"]
# MS-RDPETXT text input channels, registered only when enabled in the configuration.
text-input = ["dep:ironrdp-rdpetxt"]
# Windows MultiPoint audio level and drive letter persistence channels (MS-RDPADRV).
multipoint = ["dep:ironrdp-rdpadrv"]
core-input = ["dep:ironrdp-rdpeci"]
# Windows 365 battery status, power request, screen capture redirection, and virtual desktop control channels.
w365 = ["dep:ironrdp-w365"]
# MS-RDPEVOR video optimized remoting with MS-RDPEGT geometry tracking. The channels are only
# registered when an H.264 decoder is available: Media Foundation's on Windows by default.
video = ["dep:ironrdp-rdpevor", "dep:ironrdp-rdpegt"]
# Default H.264 decoder for the graphics pipeline and video optimized remoting, built from the
# bundled OpenH264 sources instead of Media Foundation's on Windows.
openh264 = ["ironrdp-egfx/openh264-bundled"]
# MS-RDPECAM camera redirection. Capture uses Media Foundation and is only available on Windows.
camera = ["dep:ironrdp-rdpecam", "dep:ironrdp-rdpecam-native"]
# MS-RDPEUSB USB device redirection through nusb (WinUSB on Windows, usbfs on Linux, IOKit on macOS).
usb = ["dep:ironrdp-rdpeusb", "dep:ironrdp-rdpeusb-native"]
# MS-RDPEPNP Plug and Play device redirection through an embedder-supplied backend.
pnp = ["dep:ironrdp-rdpepnp"]
cloud = [
    "dep:base64",
    "dep:picky",
    "dep:reqwest",
    "dep:rustls-native-certs",
    "dep:serde",
    "dep:serde_json",
]
udp = [
    "dep:ironrdp-rdpeudp",
    "dep:ironrdp-rdpeudp-tokio",
    "ironrdp-rdpeudp-tokio/rustls-aws-lc-rs",
]
entra-auth = [
    "dep:base64",
    "dep:picky",
    "dep:rand",
    "dep:reqwest",
    "dep:serde",
    "dep:serde_json",
    "dep:windows",
    "dep:zeroize",
]

all = [
    "sound",
    "clipboard",
    "rdpdr",
    "smartcard",
    "gateway",
    "dvc-pipe-proxy",
    "dvc-com-plugin",
    "webauthn",
    "vmconnect",
    "location",
    "telemetry",
    "text-input",
    "multipoint",
    "core-input",
    "w365",
    "camera",
    "video",
    "udp",
    "usb",
    "pnp",
    "cloud",
    "entra-auth",
]

[dependencies]
# Protocols (core features always on)
ironrdp-core = { git = "https://github.com/Devolutions/IronRDP", rev = "a8da54ba4d849370bc92e1d5230cc18e99cf5ff1", version = "0.3", features = ["alloc"] }
ironrdp-pdu = { git = "https://github.com/Devolutions/IronRDP", rev = "a8da54ba4d849370bc92e1d5230cc18e99cf5ff1", version = "0.11" } # public
ironrdp-svc = { git = "https://github.com/Devolutions/IronRDP", rev = "a8da54ba4d849370bc92e1d5230cc18e99cf5ff1", version = "0.10" } # public
ironrdp-dvc = { git = "https://github.com/Devolutions/IronRDP", rev = "a8da54ba4d849370bc92e1d5230cc18e99cf5ff1", version = "0.10" } # public
ironrdp-connector = { git = "https://github.com/Devolutions/IronRDP", rev = "a8da54ba4d849370bc92e1d5230cc18e99cf5ff1", version = "0.12" } # public
ironrdp-session = { git = "https://github.com/Devolutions/IronRDP", rev = "a8da54ba4d849370bc92e1d5230cc18e99cf5ff1", version = "0.13" } # public
ironrdp-graphics = { git = "https://github.com/Devolutions/IronRDP", rev = "a8da54ba4d849370bc92e1d5230cc18e99cf5ff1", version = "0.11" } # public
ironrdp-displaycontrol = { git = "https://github.com/Devolutions/IronRDP", rev = "a8da54ba4d849370bc92e1d5230cc18e99cf5ff1", version = "0.10" }
ironrdp-echo = { git = "https://github.com/Devolutions/IronRDP", rev = "a8da54ba4d849370bc92e1d5230cc18e99cf5ff1", version = "0.6" }
ironrdp-egfx = { git = "https://github.com/Devolutions/IronRDP", rev = "a8da54ba4d849370bc92e1d5230cc18e99cf5ff1", version = "0.5" } # public
ironrdp-rdpei = { git = "https://github.com/Devolutions/IronRDP", rev = "a8da54ba4d849370bc92e1d5230cc18e99cf5ff1", version = "0.3" } # public
ironrdp-rdpeudp = { git = "https://github.com/Devolutions/IronRDP", rev = "a8da54ba4d849370bc92e1d5230cc18e99cf5ff1", version = "0.1", optional = true }
ironrdp-rdpeudp-tokio = { git = "https://github.com/Devolutions/IronRDP", rev = "a8da54ba4d849370bc92e1d5230cc18e99cf5ff1", version = "0.2", optional = true }
ironrdp-tls = { git = "https://github.com/Devolutions/IronRDP", rev = "a8da54ba4d849370bc92e1d5230cc18e99cf5ff1", version = "0.3" } # public
ironrdp-tokio = { git = "https://github.com/Devolutions/IronRDP", rev = "a8da54ba4d849370bc92e1d5230cc18e99cf5ff1", version = "0.12", features = ["reqwest"] }
ironrdp-rdcleanpath = { git = "https://github.com/Devolutions/IronRDP", rev = "a8da54ba4d849370bc92e1d5230cc18e99cf5ff1", version = "0.3" }
ironrdp-vmconnect = { git = "https://github.com/Devolutions/IronRDP", rev = "a8da54ba4d849370bc92e1d5230cc18e99cf5ff1", version = "0.2", optional = true }
ironrdp-cfg = { git = "https://github.com/Devolutions/IronRDP", rev = "a8da54ba4d849370bc92e1d5230cc18e99cf5ff1", version = "0.3" } # public
ironrdp-propertyset = { git = "https://github.com/Devolutions/IronRDP", rev = "a8da54ba4d849370bc92e1d5230cc18e99cf5ff1", version = "0.1" } # public
ironrdp-rail = { git = "https://github.com/Devolutions/IronRDP", rev = "a8da54ba4d849370bc92e1d5230cc18e99cf5ff1", version = "0.3" }
ironrdp-rdpemsc = { git = "https://github.com/Devolutions/IronRDP", rev = "a8da54ba4d849370bc92e1d5230cc18e99cf5ff1", version = "0.0.0" }
ironrdp-rdpeci = { git = "https://github.com/Devolutions/IronRDP", rev = "a8da54ba4d849370bc92e1d5230cc18e99cf5ff1", version = "0.0.0", optional = true }

# Optional protocol crates (activated by features above)
ironrdp-cliprdr = { git = "https://github.com/Devolutions/IronRDP", rev = "a8da54ba4d849370bc92e1d5230cc18e99cf5ff1", version = "0.9", optional = true } # public
ironrdp-rdpdr = { git = "https://github.com/Devolutions/IronRDP", rev = "a8da54ba4d849370bc92e1d5230cc18e99cf5ff1", version = "0.9", optional = true } # public
ironrdp-rdpsnd = { git = "https://github.com/Devolutions/IronRDP", rev = "a8da54ba4d849370bc92e1d5230cc18e99cf5ff1", version = "0.11", optional = true }
ironrdp-rdpeai = { git = "https://github.com/Devolutions/IronRDP", rev = "a8da54ba4d849370bc92e1d5230cc18e99cf5ff1", version = "0.2", optional = true }
ironrdp-rdpel = { git = "https://github.com/Devolutions/IronRDP", rev = "a8da54ba4d849370bc92e1d5230cc18e99cf5ff1", version = "0.0.2", optional = true }
ironrdp-rdpet = { git = "https://github.com/Devolutions/IronRDP", rev = "a8da54ba4d849370bc92e1d5230cc18e99cf5ff1", version = "0.1", optional = true } # public
ironrdp-rdpetxt = { git = "https://github.com/Devolutions/IronRDP", rev = "a8da54ba4d849370bc92e1d5230cc18e99cf5ff1", version = "0.0.0", optional = true }
ironrdp-rdpadrv = { git = "https://github.com/Devolutions/IronRDP", rev = "a8da54ba4d849370bc92e1d5230cc18e99cf5ff1", version = "0.0.0", optional = true } # public
ironrdp-w365 = { git = "https://github.com/Devolutions/IronRDP", rev = "a8da54ba4d849370bc92e1d5230cc18e99cf5ff1", version = "0.1", optional = true } # public
ironrdp-rdpegt = { git = "https://github.com/Devolutions/IronRDP", rev = "a8da54ba4d849370bc92e1d5230cc18e99cf5ff1", version = "0.2", optional = true }
ironrdp-rdpevor = { git = "https://github.com/Devolutions/IronRDP", rev = "a8da54ba4d849370bc92e1d5230cc18e99cf5ff1", version = "0.2", optional = true }
ironrdp-rdpeusb = { git = "https://github.com/Devolutions/IronRDP", rev = "a8da54ba4d849370bc92e1d5230cc18e99cf5ff1", version = "0.2", optional = true }
ironrdp-rdpepnp = { git = "https://github.com/Devolutions/IronRDP", rev = "a8da54ba4d849370bc92e1d5230cc18e99cf5ff1", version = "0.1", optional = true } # public

# Optional backend crates (activated by features above)
ironrdp-rdpsnd-native = { git = "https://github.com/Devolutions/IronRDP", rev = "a8da54ba4d849370bc92e1d5230cc18e99cf5ff1", version = "0.8", optional = true } # public
ironrdp-cliprdr-native = { git = "https://github.com/Devolutions/IronRDP", rev = "a8da54ba4d849370bc92e1d5230cc18e99cf5ff1", version = "0.9", optional = true }
ironrdp-mstsgu = { git = "https://github.com/Devolutions/IronRDP", rev = "a8da54ba4d849370bc92e1d5230cc18e99cf5ff1", version = "0.1.0", optional = true }
ironrdp-dvc-pipe-proxy = { git = "https://github.com/Devolutions/IronRDP", rev = "a8da54ba4d849370bc92e1d5230cc18e99cf5ff1", version = "0.7", optional = true }
ironrdp-rdpeusb-native = { git = "https://github.com/Devolutions/IronRDP", rev = "a8da54ba4d849370bc92e1d5230cc18e99cf5ff1", version = "0.1", optional = true } # public

# Logging
tracing = { version = "0.1", features = ["log"] }

# Async, futures
tokio = { version = "1", features = ["macros", "net", "io-util", "sync", "rt", "time"] }
tokio-tungstenite = "0.29"
futures-util = { version = "0.3", features = ["sink"] }

# Utils
anyhow = "1"
smallvec = "1.15"
url = "2" # public
x509-cert = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.12.28", default-features = false, features = ["system-proxy"], optional = true } # public
rustls-native-certs = { version = "0.8", optional = true }
picky = { version = "=7.0.0-rc.27", features = ["time_conversion"], optional = true }
base64 = { version = "0.22", optional = true }
rand = { version = "0.9", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true } # public
zeroize = { version = "1", optional = true }

[target.'cfg(windows)'.dependencies]
ironrdp-dvc-com-plugin = { git = "https://github.com/Devolutions/IronRDP", rev = "a8da54ba4d849370bc92e1d5230cc18e99cf5ff1", version = "0.3", optional = true }
ironrdp-rdpewa = { git = "https://github.com/Devolutions/IronRDP", rev = "a8da54ba4d849370bc92e1d5230cc18e99cf5ff1", version = "0.2", optional = true }
ironrdp-rdpewa-native = { git = "https://github.com/Devolutions/IronRDP", rev = "a8da54ba4d849370bc92e1d5230cc18e99cf5ff1", version = "0.2", optional = true }
ironrdp-rdpecam = { git = "https://github.com/Devolutions/IronRDP", rev = "a8da54ba4d849370bc92e1d5230cc18e99cf5ff1", version = "0.2", optional = true }
ironrdp-rdpecam-native = { git = "https://github.com/Devolutions/IronRDP", rev = "a8da54ba4d849370bc92e1d5230cc18e99cf5ff1", version = "0.2", optional = true }
ironrdp-egfx-native = { git = "https://github.com/Devolutions/IronRDP", rev = "a8da54ba4d849370bc92e1d5230cc18e99cf5ff1", version = "0.2" }
windows = { version = "0.62", features = [
    "Foundation_Collections",
    "Security_Authentication_Web_Core",
    "Security_Credentials",
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_WinRT",
    "Win32_UI_WindowsAndMessaging",
], optional = true }

[dev-dependencies]
rstest = "0.26"

