version: 2
updates:
  # The app's Rust side
  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    schedule:
      interval: "weekly"
    ignore:
      # The COM implementation macros must use the same windows-core series
      # as the windows and webview2-com bindings. Lift this with their upgrade.
      - dependency-name: "windows-core"
        versions: [">=0.63"]
    groups:
      cargo-minor:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  # The app's frontend
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # SvelteKit and svelte-check support TypeScript up to 6; 7 works in
      # svelte-check only behind an experimental flag. Lift this once
      # SvelteKit lists 7 in its peer dependencies.
      - dependency-name: "typescript"
        versions: [">=7"]
      # SvelteKit 3 and adapter-static 4 only install together and move
      # every $lib import to #lib; that migration is done as its own
      # release, not as two bot PRs that each fail without the other.
      - dependency-name: "@sveltejs/kit"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@sveltejs/adapter-static"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 5

  # Workflow actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    ignore:
      # Its branches are named for Rust releases, some before they exist
      # (#122 asked for 1.120.0, which every job failed to download). The
      # pin is the Rust version and is moved by hand, see build-check.yml.
      - dependency-name: "dtolnay/rust-toolchain"
    groups:
      actions:
        patterns: ["*"]

  # The Android side of the unlock plugin (biometrics, FIDO2 keys). The app's
  # own Gradle project is generated by Tauri and not checked in.
  - package-ecosystem: "gradle"
    directory: "/src-tauri/plugins/reach-unlock/android"
    schedule:
      interval: "monthly"
    ignore:
      # The Android and Kotlin plugin versions in its settings.gradle only
      # apply when the plugin builds on its own; inside the app the
      # Tauri-generated project sets them.
      - dependency-name: "com.android.library"
      - dependency-name: "org.jetbrains.kotlin.android"
    groups:
      android-minor:
        update-types: ["minor", "patch"]
