name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "37 20 * * 2"

jobs:
  # A pull request analyzes only the languages it touches; a README edit
  # analyzes nothing. Pushes to main and the weekly run analyze everything,
  # so main's results stay complete for pull requests to compare against.
  languages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      list: ${{ steps.pick.outputs.list }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            actions:
              - '.github/**'
            javascript-typescript:
              - '**/*.{js,mjs,cjs,ts,mts,cts,svelte,astro,html}'
              - '**/package.json'
              - '**/package-lock.json'
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'

      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          CHANGED: ${{ steps.filter.outputs.changes }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            list="$CHANGED"
          else
            list='["actions","javascript-typescript","rust"]'
          fi
          echo "list=${list:-[]}" | tee -a "$GITHUB_OUTPUT"

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: languages
    if: needs.languages.outputs.list != '[]'
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
      packages: read

    strategy:
      fail-fast: false
      matrix:
        # Nothing is built: CodeQL reads Rust, TypeScript/Svelte and the
        # workflows straight from the source.
        language: ${{ fromJSON(needs.languages.outputs.list) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # Vendored and generated code is not ours to fix.
          config: |
            paths-ignore:
              - src-tauri/vendor
              - src-tauri/gen
              - node_modules
              # Test-only: fixed keys, salts and passwords on purpose (known
              # answers, test vaults). Unit tests live in *_tests.rs files.
              - src-tauri/src/**/*_tests.rs
              # Modules whose tests sit in a tests.rs beside them.
              - src-tauri/src/**/tests.rs
              # Script tests rebuild other apps' weak formats on purpose
              # (mRemoteNG's MD5 key, test passwords) to check the importers.
              - scripts/*-test.mjs
              - scripts/script-tests.mjs

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          category: "/language:${{ matrix.language }}"
