name: iOS build

# An unsigned iOS build (.ipa) of Reacher CM, for running inside LiveContainer or
# signing yourself (Sideloadly, AltStore and the like). Nothing is signed and
# no Apple account is needed; see src-tauri/ios/README.md.
#
# On a pull request only in the full tier (see build-check.yml): a Dependabot
# pull request, the full-ci label, or the repository variable CI_FULL_ON_PR.
# Every push to main still builds, so the latest main always has an IPA.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'full-ci' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # Only when the iOS app itself can change: its Rust side, config, the
  # Tauri CLI version or this workflow. A frontend-only pull request is
  # checked by build-check.yml; on main it rebuilds too, so the IPA from the
  # latest main always has the current frontend.
  changes:
    if: >-
      github.event_name != 'pull_request' ||
      (vars.CI_FULL_ON_PR == 'true' ||
       github.event.pull_request.user.login == 'dependabot[bot]' ||
       contains(github.event.pull_request.labels.*.name, 'full-ci')) &&
      (github.event.action != 'labeled' || github.event.label.name == 'full-ci')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ steps.pick.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'push'

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            ios:
              - '.github/workflows/ios-build.yml'
              - 'scripts/ios-init.sh'
              - 'src-tauri/**'
              - 'static/**'
              - 'registry/**'
              - 'package.json'
              - 'package-lock.json'
              - '!**/*.md'
            frontend:
              - 'src/**'
              - 'vite.config.ts'
              - 'tsconfig.json'
              - '!**/*.md'

      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          IOS: ${{ steps.filter.outputs.ios }}
          FRONTEND: ${{ steps.filter.outputs.frontend }}
        run: |
          build=false
          if [ "$EVENT" = workflow_dispatch ] || [ "$IOS" = true ]; then build=true; fi
          if [ "$EVENT" = push ] && [ "$FRONTEND" = true ]; then build=true; fi
          echo "build=$build" | tee -a "$GITHUB_OUTPUT"

  ipa:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    # See MACOS_RUNNER_LABEL in .github/ci-runners.md.
    runs-on: ${{ github.event_name != 'pull_request' && vars.MACOS_RUNNER_LABEL || 'macos-15' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rust
        # The same fixed Rust as build-check.yml and release.yml.
        uses: dtolnay/rust-toolchain@263313d2989f864a2b8613f97277288638e7d8f8 # 1.99.1
        with:
          targets: aarch64-apple-ios

      # Keep the Mac's own tools out of the build. MacPorts (/opt/local) has
      # its own Rust, without the cross targets installed above, and its own
      # pkg-config, through which the app was linked to MacPorts' libz: the
      # released app then would not start on any other Mac (0.9.2-dev.7).
      - name: Build with rustup's Rust and macOS's own libraries
        if: runner.environment == 'self-hosted'
        run: |
          echo "PATH=$(printf '%s' "$PATH" | tr ':' '\n' | grep -v '^/opt/local' | paste -sd: -)" >> "$GITHUB_ENV"
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
          for v in PKG_CONFIG_PATH LIBRARY_PATH CPATH C_INCLUDE_PATH CPLUS_INCLUDE_PATH \
                   DYLD_LIBRARY_PATH DYLD_FALLBACK_LIBRARY_PATH; do
            echo "$v=" >> "$GITHUB_ENV"
          done
          # Two build tools that GitHub's Macs have preinstalled: cmake
          # (libopus_sys builds Opus from source) and pod (tauri ios build
          # runs pod install). Where they only come from MacPorts, link just
          # those two programs into PATH, not MacPorts' libraries or
          # pkg-config. Homebrew is the fallback (slow on Intel Macs, which it
          # builds from source). The release's otool check still fails on any
          # library from outside macOS.
          tools="$RUNNER_TEMP/build-tools"
          mkdir -p "$tools"
          clean_path=$(printf '%s' "$PATH" | tr ':' '\n' | grep -v '^/opt/local' | paste -sd: -)
          for tool in cmake:cmake pod:cocoapods; do
            bin=${tool%%:*} formula=${tool#*:}
            PATH="$clean_path" command -v "$bin" >/dev/null && continue
            if [ -x "/opt/local/bin/$bin" ]; then
              ln -sf "/opt/local/bin/$bin" "$tools/$bin"
            else
              HOMEBREW_NO_AUTO_UPDATE=1 brew install "$formula"
            fi
          done
          echo "$tools" >> "$GITHUB_PATH"

      # On a self-hosted Mac the build stays on its own disk instead of going
      # through GitHub's cache: saving and restoring that cache moved about
      # 1.5 GB over the Mac's connection on every run. checkout wipes
      # src-tauri/target, so it is a link to a folder kept between jobs.
      - name: Keep Rust builds on the self-hosted Mac
        if: runner.environment == 'self-hosted'
        run: |
          # -2: build scripts in the first folder remembered MacPorts' libz.
          keep="$RUNNER_TOOL_CACHE/reachercm-target-2"
          mkdir -p "$keep"
          rm -rf src-tauri/target
          ln -s "$keep" src-tauri/target
          # Bundles of an earlier version must not end up in this release.
          rm -rf "$keep"/release/bundle "$keep"/*/release/bundle

      - name: Rust cache
        if: runner.environment != 'self-hosted'
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
          key: ios
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          npm ci
          # tauri ios init generates the Xcode project with XcodeGen.
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Generate the Xcode project
        run: ./scripts/ios-init.sh

      - name: Build the unsigned IPA
        run: npx tauri ios build --no-sign --target aarch64

      - name: Upload the IPA
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ReacherCM-ios-unsigned
          path: src-tauri/gen/apple/build/arm64/*.ipa
          if-no-files-found: error
          retention-days: 14
