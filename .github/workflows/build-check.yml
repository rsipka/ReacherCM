name: Build check

# Builds and tests without releasing anything, in two tiers.
#
# Fast (every pull request push, every push to main): the frontend, and the
# Rust tests and clippy on Linux. A few minutes, and no macOS runner, of
# which a free account gets only five at a time.
#
# Full: adds Windows and macOS (with the Intel Mac build), the Android tests
# on an emulator and the APK. It runs every night on main when main changed,
# on Dependabot pull requests (dependency updates are what most often break
# one platform), on a pull request labelled full-ci, and when started by
# hand. Run it (Actions > Build check > Run workflow) before tagging a release.
#
# To go back to the full tier on every pull request, set the repository
# variable CI_FULL_ON_PR to true (Settings > Secrets and variables > Actions >
# Variables). ios-build.yml and webkit-input.yml follow the same rules.
on:
  pull_request:
    branches: [main]
    # labeled: adding full-ci starts the full tier on the pull request.
    types: [opened, synchronize, reopened, labeled]
  # Also on main itself: a pull request can only restore build caches saved
  # on its own branch or on main, so this is what lets a new one start warm.
  push:
    branches: [main]
  schedule:
    # 01:17 UTC, about 2 AM in Prague.
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request makes the older run pointless.
# Another label than full-ci gets a group of its own, so it neither cancels
# the run in progress nor starts any job (see the changes job).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event.action == 'labeled' && github.event.label.name != 'full-ci' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # No debug info in CI builds: nobody attaches a debugger here, and it is
  # most of the size of target/. Smaller targets link faster and keep the
  # caches inside GitHub's 10 GB, where they are not evicted.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  # What the change touches, so a README edit does not start 40 minutes of
  # builds. Each job below runs only for its own part of the tree; the
  # "Build check result" job at the end always reports, so it is the one
  # check to make required (a skipped job counts as passed, a check that
  # never starts would leave the pull request waiting forever).
  changes:
    if: github.event.action != 'labeled' || github.event.label.name == 'full-ci'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.pick.outputs.frontend }}
      rust: ${{ steps.pick.outputs.rust }}
      mobile: ${{ steps.pick.outputs.mobile }}
      full: ${{ steps.pick.outputs.full }}
      platforms: ${{ steps.pick.outputs.platforms }}
    steps:
      # A pull request's files come from the API; a push needs the history,
      # the nightly run the date of main's last commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'push' || github.event_name == 'schedule'

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        with:
          # Markdown never builds into the app.
          predicate-quantifier: some-with-excludes
          filters: |
            frontend:
              - '.github/workflows/build-check.yml'
              - 'src/**'
              - 'static/**'
              - 'scripts/**'
              - 'registry/**'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.ts'
              - 'tsconfig.json'
              - '!**/*.md'
            # static/ and registry/ are compiled into the Rust side too
            # (include_bytes!/include_str!).
            rust:
              - '.github/workflows/build-check.yml'
              - 'src-tauri/**'
              - 'static/**'
              - 'registry/**'
              - '!**/*.md'
            # The APK also needs the Tauri CLI from package.json to match
            # the Rust crates.
            mobile:
              - '.github/workflows/build-check.yml'
              - 'src-tauri/**'
              - 'static/**'
              - 'registry/**'
              - 'package.json'
              - 'package-lock.json'
              - '!**/*.md'

      # Started by hand or at night, everything runs in the full tier; the
      # night run skips itself when main has had no commit for a day.
      - id: pick
        env:
          EVENT: ${{ github.event_name }}
          FRONTEND: ${{ steps.filter.outputs.frontend }}
          RUST: ${{ steps.filter.outputs.rust }}
          MOBILE: ${{ steps.filter.outputs.mobile }}
          FULL_ON_PR: ${{ vars.CI_FULL_ON_PR == 'true' }}
          LABELLED: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          DEPENDABOT: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
        run: |
          all=false full=false
          case "$EVENT" in
            workflow_dispatch) all=true ;;
            schedule)
              age=$(( $(date +%s) - $(git log -1 --format=%ct) ))
              if [ "$age" -lt 90000 ]; then all=true; else echo "main unchanged for a day"; fi ;;
            pull_request)
              if [ "$FULL_ON_PR" = true ] || [ "$LABELLED" = true ] || [ "$DEPENDABOT" = true ]; then full=true; fi ;;
          esac
          [ "$all" = true ] && full=true
          if [ "$EVENT" = schedule ] && [ "$all" = false ]; then
            FRONTEND=false RUST=false MOBILE=false
          fi
          for area in FRONTEND RUST MOBILE; do
            value="${!area}"
            [ "$all" = true ] && value=true
            echo "${area,,}=${value:-false}" | tee -a "$GITHUB_OUTPUT"
          done
          echo "full=$full" | tee -a "$GITHUB_OUTPUT"
          if [ "$full" = true ]; then
            echo 'platforms=["macos", "ubuntu-22.04", "windows-latest"]'
          else
            echo 'platforms=["ubuntu-22.04"]'
          fi | tee -a "$GITHUB_OUTPUT"

  # Type check, translations and the production build. The frontend is the
  # same on every platform, so once on Linux is enough.
  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Check and build the frontend
        run: |
          npm run check
          npm run i18n:check
          npm run test:scripts
          npm run build

  test:
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: false
      matrix:
        # Linux only in the fast tier.
        platform: ${{ fromJSON(needs.changes.outputs.platforms) }}

    # "macos" is not a runner name: see MACOS_RUNNER_LABEL in .github/ci-runners.md.
    runs-on: ${{ matrix.platform == 'macos' && (github.event_name != 'pull_request' && vars.MACOS_RUNNER_LABEL || 'macos-15') || matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libudev-dev libasound2-dev

      - name: Setup Rust
        # A fixed Rust, not "stable": a new stable deprecates or lints
        # something, and with warnings as errors the build breaks overnight
        # with no change of ours (1.99 renamed fetch_update). Rust is moved
        # forward on purpose, here and in release.yml together.
        uses: dtolnay/rust-toolchain@263313d2989f864a2b8613f97277288638e7d8f8 # 1.99.1
        with:
          targets: ${{ matrix.platform == 'macos' && 'x86_64-apple-darwin' || '' }}
          components: clippy

      # Keep the Mac's own tools out of the build. MacPorts (/opt/local) has
      # its own Rust, without the cross targets installed above, and its own
      # pkg-config, through which the app was linked to MacPorts' libz: the
      # released app then would not start on any other Mac (0.9.2-dev.7).
      - name: Build with rustup's Rust and macOS's own libraries
        if: runner.environment == 'self-hosted'
        run: |
          echo "PATH=$(printf '%s' "$PATH" | tr ':' '\n' | grep -v '^/opt/local' | paste -sd: -)" >> "$GITHUB_ENV"
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
          for v in PKG_CONFIG_PATH LIBRARY_PATH CPATH C_INCLUDE_PATH CPLUS_INCLUDE_PATH \
                   DYLD_LIBRARY_PATH DYLD_FALLBACK_LIBRARY_PATH; do
            echo "$v=" >> "$GITHUB_ENV"
          done
          # Two build tools that GitHub's Macs have preinstalled: cmake
          # (libopus_sys builds Opus from source) and pod (tauri ios build
          # runs pod install). Where they only come from MacPorts, link just
          # those two programs into PATH, not MacPorts' libraries or
          # pkg-config. Homebrew is the fallback (slow on Intel Macs, which it
          # builds from source). The release's otool check still fails on any
          # library from outside macOS.
          tools="$RUNNER_TEMP/build-tools"
          mkdir -p "$tools"
          clean_path=$(printf '%s' "$PATH" | tr ':' '\n' | grep -v '^/opt/local' | paste -sd: -)
          for tool in cmake:cmake pod:cocoapods; do
            bin=${tool%%:*} formula=${tool#*:}
            PATH="$clean_path" command -v "$bin" >/dev/null && continue
            if [ -x "/opt/local/bin/$bin" ]; then
              ln -sf "/opt/local/bin/$bin" "$tools/$bin"
            else
              HOMEBREW_NO_AUTO_UPDATE=1 brew install "$formula"
            fi
          done
          echo "$tools" >> "$GITHUB_PATH"

      # On a self-hosted Mac the build stays on its own disk instead of going
      # through GitHub's cache: saving and restoring that cache moved about
      # 1.5 GB over the Mac's connection on every run. checkout wipes
      # src-tauri/target, so it is a link to a folder kept between jobs.
      - name: Keep Rust builds on the self-hosted Mac
        if: runner.environment == 'self-hosted'
        run: |
          # -2: build scripts in the first folder remembered MacPorts' libz.
          keep="$RUNNER_TOOL_CACHE/reachercm-target-2"
          mkdir -p "$keep"
          rm -rf src-tauri/target
          ln -s "$keep" src-tauri/target
          # Bundles of an earlier version must not end up in this release.
          rm -rf "$keep"/release/bundle "$keep"/*/release/bundle

      - name: Rust cache
        if: runner.environment != 'self-hosted'
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
          # Only main saves. A pull request restores main's cache anyway, and
          # one saving its own pushed main's out of the 10 GB GitHub keeps:
          # the next run then built everything cold, 18 minutes for Android.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      # tauri-build wants the built frontend to exist.
      - name: Build the frontend
        run: npm run build

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib

      # Each platform compiles its own code (Windows Hello, Touch ID, USB
      # security keys), so each one is linted: no warning gets merged.
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --lib --tests -- -D warnings

      # GitHub's runner is Apple silicon; Intel Macs get their own release build.
      - name: Build for Intel Macs
        if: matrix.platform == 'macos'
        working-directory: src-tauri
        run: cargo build --lib --target x86_64-apple-darwin

  # The Rust tests on a real Android system image. They cannot run on the
  # desktop runners: Android has its own C library, and system libraries such
  # as zlib that the app links against come from the device.
  android:
    needs: changes
    if: needs.changes.outputs.rust == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Rust
        # A fixed Rust, not "stable": a new stable deprecates or lints
        # something, and with warnings as errors the build breaks overnight
        # with no change of ours (1.99 renamed fetch_update). Rust is moved
        # forward on purpose, here and in release.yml together.
        uses: dtolnay/rust-toolchain@263313d2989f864a2b8613f97277288638e7d8f8 # 1.99.1
        with:
          targets: x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
          # Only main saves. A pull request restores main's cache anyway, and
          # one saving its own pushed main's out of the 10 GB GitHub keeps:
          # the next run then built everything cold, 18 minutes for Android.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      # tauri-build wants the built frontend to exist.
      - name: Build the frontend
        run: |
          npm ci
          npm run build

      - name: Build the test binary for Android
        working-directory: src-tauri
        run: |
          BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_x86_64_linux_android="$BIN/x86_64-linux-android24-clang"
          export CXX_x86_64_linux_android="$BIN/x86_64-linux-android24-clang++"
          export AR_x86_64_linux_android="$BIN/llvm-ar"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$BIN/x86_64-linux-android24-clang"
          TEST_BIN=$(cargo test --lib --no-run --target x86_64-linux-android --message-format=json \
            | jq -r 'select(.reason == "compiler-artifact" and .profile.test == true and .executable != null) | .executable' | tail -1)
          mkdir -p "$RUNNER_TEMP/android-test"
          cp "$TEST_BIN" "$RUNNER_TEMP/android-test/reach-tests"
          cp "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/x86_64-linux-android/libc++_shared.so" "$RUNNER_TEMP/android-test/"
          # The known_hosts tests compare with OpenSSH's output, kept next to them.
          cp -r src/ssh/knownhosts/testdata "$RUNNER_TEMP/android-test/testdata"

      - name: Run the tests on an Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            adb push "$RUNNER_TEMP/android-test/." /data/local/tmp/reach/
            adb shell "cd /data/local/tmp/reach && chmod +x reach-tests && REACH_KNOWNHOSTS_TESTDATA=/data/local/tmp/reach/testdata HOME=/data/local/tmp/reach TMPDIR=/data/local/tmp/reach LD_LIBRARY_PATH=/data/local/tmp/reach ./reach-tests"

  # The APKs, packaged the way the release packages them: the same generated
  # Gradle project, the same signing and packaging block, the same build
  # command. Signed with a throwaway key made here, since only the release has
  # the real one. The test job above builds the Rust side only.
  android-apk:
    needs: changes
    if: needs.changes.outputs.mobile == 'true' && needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Java 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Setup Rust
        # A fixed Rust, not "stable": a new stable deprecates or lints
        # something, and with warnings as errors the build breaks overnight
        # with no change of ours (1.99 renamed fetch_update). Rust is moved
        # forward on purpose, here and in release.yml together.
        uses: dtolnay/rust-toolchain@263313d2989f864a2b8613f97277288638e7d8f8 # 1.99.1
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
          # Only main saves. A pull request restores main's cache anyway, and
          # one saving its own pushed main's out of the 10 GB GitHub keeps:
          # the next run then built everything cold, 18 minutes for Android.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Initialize Android project
        run: |
          npx tauri android init
          # init generates the project with Tauri's placeholder icon; Reacher CM's
          # launcher icons (adaptive included) replace it.
          cp -r src-tauri/icons/android/. src-tauri/gen/android/app/src/main/res/
          # Its activity also makes room for the phone keyboard (#127).
          cp src-tauri/android/MainActivity.kt src-tauri/gen/android/app/src/main/java/com/reachercm/client/MainActivity.kt
          # R8 keep rules for the QR code scanner's ML Kit.
          cat src-tauri/android/proguard-rules.pro >> src-tauri/gen/android/app/proguard-rules.pro
          # ML Kit's bundled barcode model instead of the Play Services one, so
          # the QR scanner works on phones without Google Play Services.
          cat src-tauri/android/no-gms.gradle.kts >> src-tauri/gen/android/app/build.gradle.kts

      - name: Make a throwaway signing key
        run: keytool -genkeypair -keystore "$RUNNER_TEMP/check.keystore" -alias reach -keyalg RSA -keysize 2048 -validity 1 -storepass checkcheck -keypass checkcheck -dname "CN=Build check"

      - name: Configure signing and packaging in Gradle
        run: |
          cat >> src-tauri/gen/android/app/build.gradle.kts << 'GRADLE'

          android {
              signingConfigs {
                  create("release") {
                      storeFile = file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias = "reach"
                      keyPassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }
          }
          GRADLE

      - name: Build Android APKs
        # The NDK path comes from the runner image, so it is read in the shell:
        # ${{ env.X }} sees only variables the workflow sets itself, and was
        # empty. The newest installed NDK, the one tauri android init uses.
        run: |
          export NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK_HOME=$NDK_HOME"
          npx tauri android build --apk --split-per-abi --target aarch64 --target armv7
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/check.keystore
          ANDROID_KEYSTORE_PASSWORD: checkcheck

      - name: The APKs are there and signed
        run: |
          OUT=src-tauri/gen/android/app/build/outputs/apk
          find $OUT -name '*release*.apk' | tee /tmp/apks
          [ "$(wc -l < /tmp/apks)" -eq 2 ]
          BUILD_TOOLS=$(ls -d $ANDROID_SDK_ROOT/build-tools/*/ | sort -V | tail -1)
          while read apk; do ${BUILD_TOOLS}apksigner verify "$apk"; done < /tmp/apks

      - name: The QR scanner's keep rules reached R8
        run: |
          conf=$(find src-tauri/gen/android/app/build/outputs/mapping -name configuration.txt | head -1)
          if [ -z "$conf" ]; then echo "::warning::No R8 configuration.txt to check."; exit 0; fi
          grep -q 'implements com.google.firebase.components.ComponentRegistrar' "$conf"

      - name: The QR scanner needs no Google Play Services
        # The bundled barcode model and its native library are in each APK.
        run: |
          for apk in $(cat /tmp/apks); do
            unzip -l "$apk" | grep -q 'libbarhopper' || { echo "::error::$apk has no bundled barcode model."; exit 1; }
          done

  # The one check to require in branch protection: it always runs, passes
  # when every job above passed or was skipped, and fails otherwise.
  result:
    name: Build check result
    # Not for a label other than full-ci: that event checks nothing.
    if: always() && (github.event.action != 'labeled' || github.event.label.name == 'full-ci')
    needs: [changes, frontend, test, android, android-apk]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done
