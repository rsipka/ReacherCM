name: Release

on:
  push:
    tags:
      - 'v*'

# vX.Y.Z-dev.N tags make a pre-release (Reacher CM Dev), vX.Y.Z a stable one.
# Either way the release's latest.json and apps.json are copied to the
# update-feed branch, which the in-app updaters and LiveContainer read: GitHub's
# releases/latest skips pre-releases, so it cannot serve dev builds.
# See .github/dev-release.md.

permissions:
  contents: write
  # To start the website deploy after a stable release; see the last step of
  # publish-release.
  actions: write

jobs:
  # The one release every build uploads into. When each build made the
  # release itself, two finishing at the same moment each found none and made
  # one: in 0.7.1 the Windows files and their updater entries went into a
  # second draft that was never published, so Windows was never offered the
  # update. Created once here, before any build starts, it cannot be doubled.
  create-release:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create the draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(jq -r .version src-tauri/tauri.conf.json)
          if [[ "$GITHUB_REF_NAME" != "v$version" || ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-dev\.[1-9][0-9]*)?$ ]]; then
            echo "::error::The tag must be v plus the app version (src-tauri/tauri.conf.json): vMAJOR.MINOR.PATCH or vMAJOR.MINOR.PATCH-dev.N."
            exit 1
          fi
          # Every build needs its own Windows and Android version number,
          # or Windows and Android refuse to install it over the last one.
          # A stable release takes build number 999, so it installs over the
          # same version's dev builds (scripts/release.mjs sets these).
          IFS=. read -r major minor patch <<< "${version%-dev.*}"
          n=999
          [[ "$version" != *-dev.* ]] || n="${version##*.}"
          want_wix="${version%-dev.*}.$n"
          want_code=$(( major * 10000000 + minor * 100000 + patch * 1000 + n ))
          wix=$(jq -r .bundle.windows.wix.version src-tauri/tauri.conf.json)
          code=$(jq -r .bundle.android.versionCode src-tauri/tauri.conf.json)
          if [[ "$wix" != "$want_wix" || "$code" != "$want_code" ]]; then
            echo "::error::For $version set bundle.windows.wix.version to $want_wix (is $wix) and bundle.android.versionCode to $want_code (is $code) in src-tauri/tauri.conf.json, or run npm run release."
            exit 1
          fi
          name="Reacher CM $GITHUB_REF_NAME"
          [[ "$version" != *-dev.* ]] || name="Reacher CM Dev $GITHUB_REF_NAME"
          # A re-run finds the draft its first run made.
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\") | .id" | head -1)
          if [ -z "$id" ]; then
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$GITHUB_REF_NAME" \
              -f name="$name" \
              -F body=@.github/release-notes.md \
              -F draft=true \
              --jq .id)
          fi
          echo "Release $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build-desktop:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          - platform: macos
            args: '--target aarch64-apple-darwin'
          - platform: macos
            args: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: '--bundles deb,appimage'

    # "macos" is not a runner name: see MACOS_RUNNER_LABEL in .github/ci-runners.md.
    runs-on: ${{ matrix.platform == 'macos' && (github.event_name != 'pull_request' && vars.MACOS_RUNNER_LABEL || 'macos-15') || matrix.platform }}
    # GitHub's runners set CI=true; the self-hosted Mac may not. With it,
    # and TAURI_BUNDLER_DMG_IGNORE_CI=false below, Tauri skips the Finder step.
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev libasound2-dev rpm

      - name: Setup Rust
        # A fixed Rust, not "stable": a new stable deprecates or lints
        # something, and with warnings as errors the build breaks overnight
        # with no change of ours (1.99 renamed fetch_update). Rust is moved
        # forward on purpose, here and in release.yml together.
        uses: dtolnay/rust-toolchain@263313d2989f864a2b8613f97277288638e7d8f8 # 1.99.1
        with:
          targets: ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      # Keep the Mac's own tools out of the build. MacPorts (/opt/local) has
      # its own Rust, without the cross targets installed above, and its own
      # pkg-config, through which the app was linked to MacPorts' libz: the
      # released app then would not start on any other Mac (0.9.2-dev.7).
      - name: Build with rustup's Rust and macOS's own libraries
        if: runner.environment == 'self-hosted'
        run: |
          echo "PATH=$(printf '%s' "$PATH" | tr ':' '\n' | grep -v '^/opt/local' | paste -sd: -)" >> "$GITHUB_ENV"
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
          for v in PKG_CONFIG_PATH LIBRARY_PATH CPATH C_INCLUDE_PATH CPLUS_INCLUDE_PATH \
                   DYLD_LIBRARY_PATH DYLD_FALLBACK_LIBRARY_PATH; do
            echo "$v=" >> "$GITHUB_ENV"
          done
          # Two build tools that GitHub's Macs have preinstalled: cmake
          # (libopus_sys builds Opus from source) and pod (tauri ios build
          # runs pod install). Where they only come from MacPorts, link just
          # those two programs into PATH, not MacPorts' libraries or
          # pkg-config. Homebrew is the fallback (slow on Intel Macs, which it
          # builds from source). The release's otool check still fails on any
          # library from outside macOS.
          tools="$RUNNER_TEMP/build-tools"
          mkdir -p "$tools"
          clean_path=$(printf '%s' "$PATH" | tr ':' '\n' | grep -v '^/opt/local' | paste -sd: -)
          for tool in cmake:cmake pod:cocoapods; do
            bin=${tool%%:*} formula=${tool#*:}
            PATH="$clean_path" command -v "$bin" >/dev/null && continue
            if [ -x "/opt/local/bin/$bin" ]; then
              ln -sf "/opt/local/bin/$bin" "$tools/$bin"
            else
              HOMEBREW_NO_AUTO_UPDATE=1 brew install "$formula"
            fi
          done
          echo "$tools" >> "$GITHUB_PATH"

      # On a self-hosted Mac the build stays on its own disk instead of going
      # through GitHub's cache: saving and restoring that cache moved about
      # 1.5 GB over the Mac's connection on every run. checkout wipes
      # src-tauri/target, so it is a link to a folder kept between jobs.
      - name: Keep Rust builds on the self-hosted Mac
        if: runner.environment == 'self-hosted'
        run: |
          # -2: build scripts in the first folder remembered MacPorts' libz.
          keep="$RUNNER_TOOL_CACHE/reachercm-target-2"
          mkdir -p "$keep"
          rm -rf src-tauri/target
          ln -s "$keep" src-tauri/target
          # Bundles of an earlier version must not end up in this release.
          rm -rf "$keep"/release/bundle "$keep"/*/release/bundle

      - name: Rust cache
        if: runner.environment != 'self-hosted'
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
          # A cache saved under a tag can only be restored by that same tag,
          # so it is never used again; saving it only evicts main's caches.
          save-if: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      # macOS 15 only offers the Local Network prompt to builds signed with an
      # Apple-issued certificate (issue #47). When the secrets are present the
      # build is signed and notarized.
      #
      # When they are not, the bundle is still ad-hoc signed. Without this the
      # only signature on a release is the one the linker puts on the
      # executable, which leaves the bundle itself unsealed -- `codesign
      # --verify --deep --strict` reports "code has no resources but signature
      # indicates they must be present", and `Sealed Resources=none`. macOS
      # identifies an app for the Local Network grant by its code signature, so
      # a bundle with no seal has nothing stable to be granted, which is why
      # re-signing by hand was what restored access on the reporter's machine.
      # Tauri reads "-" as the ad-hoc identity and signs the whole bundle,
      # nested code included, before it builds the DMG. This is not a
      # substitute for Developer ID and notarization: Gatekeeper still blocks a
      # downloaded copy, and the signature changes with every build, so the
      # grant is not guaranteed to survive an update.
      #
      # The variables are exported from the shell rather than set on the job,
      # because an empty APPLE_SIGNING_IDENTITY would be taken as an identity
      # and make codesign fail with "no identity found".
      - name: Enable macOS signing when credentials are present
        if: matrix.platform == 'macos'
        env:
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID_: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD_: ${{ secrets.APPLE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$IDENTITY" ]; then
            echo "No Apple signing identity configured; falling back to ad-hoc."
            echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
            exit 0
          fi
          {
            echo "APPLE_SIGNING_IDENTITY=$IDENTITY"
            echo "APPLE_CERTIFICATE=$CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERTIFICATE_PASSWORD"
            echo "APPLE_ID=$APPLE_ID_"
            echo "APPLE_PASSWORD=$APPLE_PASSWORD_"
            echo "APPLE_TEAM_ID=$TEAM_ID"
          } >> "$GITHUB_ENV"
          echo "macOS signing enabled."

      # A Developer ID profile for this app enables the Data Protection
      # Keychain used by SSH passphrases protected with Touch ID.
      - name: Configure macOS Touch ID when a provisioning profile is present
        if: matrix.platform == 'macos'
        shell: bash
        env:
          PROFILE_BASE64: ${{ secrets.APPLE_MACOS_PROVISIONING_PROFILE }}
        run: |
          set -euo pipefail
          if [ -z "$PROFILE_BASE64" ]; then exit 0; fi
          if [ "${APPLE_SIGNING_IDENTITY:-}" = '-' ] || [ -z "${APPLE_TEAM_ID:-}" ]; then
            echo "::error::The macOS Touch ID profile requires Developer ID signing and APPLE_TEAM_ID."
            exit 1
          fi
          profile="$RUNNER_TEMP/reachercm-macos.provisionprofile"
          payload="$RUNNER_TEMP/reachercm-macos-profile.plist"
          printf '%s' "$PROFILE_BASE64" | /usr/bin/base64 -D > "$profile"
          /usr/bin/security cms -D -i "$profile" -o "$payload"
          app_id=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.application-identifier' "$payload")
          node --input-type=module - "$profile" "$app_id" <<'JS'
          import fs from 'node:fs';
          const [, , profile, appId] = process.argv;
          const path = 'src-tauri/tauri.conf.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          const expected = `${process.env.APPLE_TEAM_ID}.${config.identifier}`;
          if (appId !== expected) throw new Error('The macOS provisioning profile must match this app and signing team.');
          const mac = config.bundle.macOS;
          mac.files = { ...mac.files, 'embedded.provisionprofile': profile };
          fs.writeFileSync(path, JSON.stringify(config, null, 2));
          JS
          /usr/libexec/PlistBuddy -c "Add :com.apple.application-identifier string $app_id" src-tauri/Entitlements.plist

      # The release description, and the notes the in-app updater shows (they
      # reach latest.json from releaseBody). The app shows them in its What's
      # new dialog: "- " lines as a list, "#" lines as headings and http(s)
      # links clickable, everything else as plain text, so keep it short.
      - name: Read the release notes
        id: notes
        shell: bash
        run: |
          {
            echo 'body<<RELEASE_NOTES_EOF'
            cat .github/release-notes.md
            echo 'RELEASE_NOTES_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Configure the fork updater public key
        shell: bash
        env:
          UPDATER_PUBLIC_KEY: ${{ vars.TAURI_SIGNING_PUBLIC_KEY }}
          UPDATER_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$UPDATER_PUBLIC_KEY" ]; then
            echo "::error::Set the TAURI_SIGNING_PUBLIC_KEY repository variable."
            exit 1
          fi
          if [ -z "$UPDATER_PRIVATE_KEY" ]; then
            echo "::error::Set the TAURI_SIGNING_PRIVATE_KEY repository secret."
            exit 1
          fi
          unset UPDATER_PRIVATE_KEY
          node --input-type=module -e '
            import fs from "node:fs";
            const path = "src-tauri/tauri.conf.json";
            const config = JSON.parse(fs.readFileSync(path, "utf8"));
            config.plugins.updater.pubkey = process.env.UPDATER_PUBLIC_KEY.trim();
            fs.writeFileSync(path, JSON.stringify(config, null, 2));
          '

      - name: Build and release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The DMG window layout is set by driving Finder over AppleScript.
          # tauri-action turns that on even on CI; on the self-hosted Mac,
          # where the runner is a background service, Finder never answers
          # and the build fails after two minutes (AppleEvent timed out).
          # There the DMG gets Finder's default layout instead.
          TAURI_BUNDLER_DMG_IGNORE_CI: ${{ runner.environment == 'self-hosted' && 'false' || 'true' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          NO_STRIP: true
          APPIMAGE_EXTRACT_AND_RUN: 1
          # AppImage update information (AppImageSpec, gh-releases-zsync):
          # linuxdeploy's AppImage plugin embeds it and writes the .zsync file,
          # so AppImageUpdate, AppImageLauncher and Gear Lever can update Reacher CM
          # as well as its own updater. Read only by the Linux build.
          LDAI_UPDATE_INFORMATION: gh-releases-zsync|${{ github.repository_owner }}|ReacherCM|latest|ReacherCM_*_amd64.AppImage.zsync
        with:
          # Into the release made above, never a new one.
          releaseId: ${{ needs.create-release.outputs.id }}
          # Still read for the in-app updater's notes in latest.json.
          releaseBody: ${{ steps.notes.outputs.body }}
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      # The .zsync that the update information above points to belongs next to
      # the AppImage in the release; tauri-action uploads only the bundles.
      # appimagetool writes it into its working directory, which under the
      # Tauri CLI is src-tauri/, not the bundle folder (seen in a local build).
      # It must describe the very AppImage being shipped, so its name and
      # SHA-1 are checked against that file before anything is uploaded.
      - name: Upload the AppImage .zsync
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.id }}
        run: |
          set -euo pipefail
          found=0
          for f in src-tauri/*.AppImage.zsync; do
            [ -f "$f" ] || continue
            found=1
            img="src-tauri/target/release/bundle/appimage/$(basename "$f" .zsync)"
            [ -f "$img" ] || { echo "::error::$f has no matching AppImage at $img"; exit 1; }
            grep -aqx "Filename: $(basename "$img")" "$f" || { echo "::error::$f names another file"; exit 1; }
            grep -aqx "SHA-1: $(sha1sum "$img" | cut -d' ' -f1)" "$f" || { echo "::error::$f does not match $img"; exit 1; }
            url="https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$(basename "$f")"
            gh api --method POST -H "Content-Type: application/octet-stream" "$url" --input "$f" --jq .name
          done
          [ "$found" -eq 1 ] || { echo "::error::No .zsync was made: the AppImage has no update information."; exit 1; }

      # A bundle that ships without a sealed signature is the defect from
      # issue #47, and it is invisible until someone runs codesign on an
      # installed copy. Fail the build here instead.
      - name: Verify the macOS bundle signature
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail
          found=0
          for app in src-tauri/target/*/release/bundle/macos/*.app; do
            [ -d "$app" ] || continue
            found=1
            echo "::group::$app"
            codesign --verify --deep --strict --verbose=4 "$app"
            codesign --display --verbose=4 "$app" 2>&1 | tee /tmp/sig.txt
            echo "::endgroup::"
            if grep -q "Sealed Resources=none" /tmp/sig.txt; then
              echo "::error::$app has no sealed resources; the bundle was not signed."
              exit 1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::No .app bundle found to verify."
            exit 1
          fi
          echo "Bundle signature verified."

      # An app linked to a library outside macOS and its own bundle starts
      # only on the Mac that built it (dyld "Library not loaded" on every
      # other one). Fail the release before it is published instead.
      - name: Check the app uses only macOS's libraries and its own
        if: matrix.platform == 'macos'
        run: |
          set -euo pipefail
          bad=0 found=0
          for app in src-tauri/target/*/release/bundle/macos/*.app; do
            [ -d "$app" ] || continue
            while IFS= read -r -d '' bin; do
              file "$bin" | grep -q 'Mach-O' || continue
              found=1
              echo "::group::$bin"
              otool -L "$bin"
              echo "::endgroup::"
              outside=$(otool -L "$bin" | tail -n +2 | awk '{print $1}' \
                | grep -vE '^(/System/Library/|/usr/lib/|@rpath/|@executable_path/|@loader_path/)' || true)
              if [ -n "$outside" ]; then
                echo "::error::$bin links libraries outside macOS and the app: $(echo $outside)"
                bad=1
              fi
            done < <(find "$app/Contents" -type f \( -perm -u+x -o -name '*.dylib' \) -print0)
          done
          [ "$found" -eq 1 ] || { echo "::error::No app binary found to check."; exit 1; }
          [ "$bad" -eq 0 ]

      # The pinned Tauri CLI passes the app version through to RPM as-is.
      # RPM reserves hyphens, so put the dev suffix in its Release field.
      - name: Bundle and upload the RPM
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          release=1
          [[ "$version" != *-dev.* ]] || release="0.dev.${version##*.}"
          npx tauri bundle --ci --bundles rpm \
            --config "{\"version\":\"${version%-dev.*}\",\"bundle\":{\"createUpdaterArtifacts\":false,\"linux\":{\"rpm\":{\"release\":\"$release\"}}}}"
          gh release upload "$GITHUB_REF_NAME" src-tauri/target/release/bundle/rpm/*.rpm --clobber

  publish-release:
    needs: [create-release, build-desktop, build-android, build-ios]
    runs-on: ubuntu-24.04
    steps:
      # First: checking out later would clean away the files below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The last look before users see it: every platform the updater serves
      # must be in latest.json with a signature. Anything missing stops the
      # release here, as a draft, instead of leaving those users without the
      # update and nobody knowing.
      - name: Check the updater manifest lists every platform
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.id }}
        run: |
          set -euo pipefail
          asset=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
            --jq '.[] | select(.name == "latest.json") | .id')
          [ -n "$asset" ] || { echo "::error::latest.json is missing from the release."; exit 1; }
          gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$asset" > latest.json
          jq -e --arg version "${GITHUB_REF_NAME#v}" '(.version | ltrimstr("v")) == $version' latest.json >/dev/null
          missing=0
          for platform in windows-x86_64 darwin-aarch64 darwin-x86_64 linux-x86_64; do
            sig=$(jq -r --arg p "$platform" '.platforms[$p].signature // empty' latest.json)
            if [ -z "$sig" ]; then
              echo "::error::latest.json has no signed entry for $platform."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          apks=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --jq '[.[] | select(.name | endswith(".apk"))] | length')
          [ "$apks" -ge 2 ] || { echo "::error::The Android APKs are missing from the release."; exit 1; }
          echo "Every platform is in latest.json, and the APKs are attached."

      # Stable releases only: apt install reacher-cm / dnf install reacher-cm. The indexes are signed with
      # the repository key (secrets APT_GPG_PRIVATE_KEY, APT_GPG_PASSPHRASE)
      # and nothing is published without them: a missing key stops the
      # release here, as a draft. APT's flat index goes into the release
      # beside the .deb; dnf's repodata cannot (asset names have no
      # folders), so it travels as one archive that pages.yml unpacks on the website.
      - name: Sign the apt and dnf repositories
        if: ${{ !contains(github.ref_name, '-dev.') }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.id }}
          REPO_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          REPO_GPG_PASSPHRASE: ${{ secrets.APT_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq apt-utils createrepo-c
          mkdir -p pkgs
          for kind in deb rpm; do
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
              --jq "[.[] | select(.name | endswith(\".$kind\"))][0].id")
            name=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
              --jq "[.[] | select(.name | endswith(\".$kind\"))][0].name")
            [ -n "$id" ] || { echo "::error::No .$kind in the release"; exit 1; }
            gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$id" > "pkgs/$name"
          done
          bash scripts/package-repos.sh pkgs repo "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME"
          tar -C repo/rpm -czf rpm-repodata.tar.gz repodata
          for f in repo/apt/InRelease repo/apt/Release repo/apt/Release.gpg repo/apt/Packages repo/apt/Packages.gz repo/reachercm-packages.asc rpm-repodata.tar.gz; do
            gh api --method POST -H "Content-Type: application/octet-stream" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$(basename "$f")" \
              --input "$f" --jq .name
          done

      # apps.json, the AltStore-style source LiveContainer reads (see
      # scripts/ios-source.mjs). Attached to the release, and copied to the
      # update feed below.
      - name: Build the LiveContainer source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --slurp > releases.json
          node scripts/ios-source.mjs --releases releases.json --tag "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --info src-tauri/Info.ios.plist --out apps.json
          gh release upload "$GITHUB_REF_NAME" apps.json --repo "$GITHUB_REPOSITORY" --clobber

      # A dev build is a pre-release; a stable one becomes the latest release.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" == *-dev.* ]]; then
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false
          else
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
          fi

      # The update feed: one commit on the update-feed branch holding this
      # release's latest.json (desktop updater, Android update check) and
      # apps.json (LiveContainer). Replaced on every release, after the
      # release is public so its download links already work.
      - name: Update the update feed
        run: |
          set -euo pipefail
          git checkout -q --orphan update-feed-new
          git rm -rq --cached .
          printf '%s\n' "Update feed of the latest Reacher CM release ($GITHUB_REF_NAME), written by release.yml. Do not edit." > FEED.md
          git add -f latest.json apps.json FEED.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -qm "Update feed: $GITHUB_REF_NAME"
          git push -q --force origin HEAD:refs/heads/update-feed
          echo "update-feed now serves $GITHUB_REF_NAME"

      # dnf reads its repository from the website, which pages.yml fills from
      # the latest release. A release made with the workflow's own token never
      # raises "release published" for other workflows, and workflow_dispatch
      # is the one event that rule exempts, so ask directly.
      - name: Publish the dnf repository on the website
        if: ${{ !contains(github.ref_name, '-dev.') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main

  build-android:
    needs: create-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Java 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4

      - name: Setup Rust
        # A fixed Rust, not "stable": a new stable deprecates or lints
        # something, and with warnings as errors the build breaks overnight
        # with no change of ours (1.99 renamed fetch_update). Rust is moved
        # forward on purpose, here and in release.yml together.
        uses: dtolnay/rust-toolchain@263313d2989f864a2b8613f97277288638e7d8f8 # 1.99.1
        with:
          # Phones only: x86 builds serve emulators, and each target added a
          # full copy of the app to the APK and to the build time.
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Rust cache
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: src-tauri -> target
          # A cache saved under a tag can only be restored by that same tag,
          # so it is never used again; saving it only evicts main's caches.
          save-if: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Initialize Android project
        run: |
          npx tauri android init
          # init generates the project with Tauri's placeholder icon; Reacher CM's
          # launcher icons (adaptive included) replace it.
          cp -r src-tauri/icons/android/. src-tauri/gen/android/app/src/main/res/
          # Its activity also makes room for the phone keyboard (#127).
          cp src-tauri/android/MainActivity.kt src-tauri/gen/android/app/src/main/java/com/reachercm/client/MainActivity.kt
          # R8 keep rules for the QR code scanner's ML Kit.
          cat src-tauri/android/proguard-rules.pro >> src-tauri/gen/android/app/proguard-rules.pro
          # ML Kit's bundled barcode model instead of the Play Services one, so
          # the QR scanner works on phones without Google Play Services.
          cat src-tauri/android/no-gms.gradle.kts >> src-tauri/gen/android/app/build.gradle.kts

      # One permanent key, kept as a repository secret. Android installs an
      # update only over an app signed with the same key, so a key made fresh
      # for each build meant every update failed until the old app was removed.
      - name: Restore signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "::error::Set ANDROID_KEYSTORE_BASE64."; exit 1; }
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Configure signing and packaging in Gradle
        run: |
          cat >> src-tauri/gen/android/app/build.gradle.kts << 'GRADLE'

          android {
              signingConfigs {
                  create("release") {
                      storeFile = file(System.getenv("ANDROID_KEYSTORE_PATH"))
                      storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias = "reach"
                      keyPassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  }
              }
              buildTypes {
                  getByName("release") {
                      signingConfig = signingConfigs.getByName("release")
                  }
              }
              // Compress the native library inside the APK. Android's default
              // stores it as-is so it can be mapped in place, which made the
              // download as large as the library itself.
              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }
          }
          GRADLE

      - name: Build Android APKs
        # The NDK path comes from the runner image, so it is read in the shell:
        # ${{ env.X }} sees only variables the workflow sets itself, and was
        # empty. The newest installed NDK, the one tauri android init uses.
        run: |
          export NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          echo "NDK_HOME=$NDK_HOME"
          npx tauri android build --apk --split-per-abi --target aarch64 --target armv7
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}

      - name: Name the APKs after the release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          OUT=src-tauri/gen/android/app/build/outputs/apk
          mkdir -p dist-android
          cp "$(find $OUT -path '*arm64*' -name '*release*.apk' | head -1)" "dist-android/ReacherCM_${VERSION}_android_arm64.apk"
          cp "$(find $OUT -path '*arm*' ! -path '*arm64*' -name '*release*.apk' | head -1)" "dist-android/ReacherCM_${VERSION}_android_armv7.apk"
          BUILD_TOOLS=$(ls -d $ANDROID_SDK_ROOT/build-tools/*/ | sort -V | tail -1)
          for apk in dist-android/*.apk; do ${BUILD_TOOLS}apksigner verify "$apk"; done
          ls -la dist-android

      - name: Upload APKs to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist-android/*.apk --clobber

  build-ios:
    needs: create-release
    runs-on: ${{ github.event_name != 'pull_request' && vars.MACOS_RUNNER_LABEL || 'macos-15' }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@263313d2989f864a2b8613f97277288638e7d8f8 # 1.99.1
        with:
          targets: aarch64-apple-ios
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
      # Keep the Mac's own tools out of the build. MacPorts (/opt/local) has
      # its own Rust, without the cross targets installed above, and its own
      # pkg-config, through which the app was linked to MacPorts' libz: the
      # released app then would not start on any other Mac (0.9.2-dev.7).
      - name: Build with rustup's Rust and macOS's own libraries
        if: runner.environment == 'self-hosted'
        run: |
          echo "PATH=$(printf '%s' "$PATH" | tr ':' '\n' | grep -v '^/opt/local' | paste -sd: -)" >> "$GITHUB_ENV"
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
          for v in PKG_CONFIG_PATH LIBRARY_PATH CPATH C_INCLUDE_PATH CPLUS_INCLUDE_PATH \
                   DYLD_LIBRARY_PATH DYLD_FALLBACK_LIBRARY_PATH; do
            echo "$v=" >> "$GITHUB_ENV"
          done
          # Two build tools that GitHub's Macs have preinstalled: cmake
          # (libopus_sys builds Opus from source) and pod (tauri ios build
          # runs pod install). Where they only come from MacPorts, link just
          # those two programs into PATH, not MacPorts' libraries or
          # pkg-config. Homebrew is the fallback (slow on Intel Macs, which it
          # builds from source). The release's otool check still fails on any
          # library from outside macOS.
          tools="$RUNNER_TEMP/build-tools"
          mkdir -p "$tools"
          clean_path=$(printf '%s' "$PATH" | tr ':' '\n' | grep -v '^/opt/local' | paste -sd: -)
          for tool in cmake:cmake pod:cocoapods; do
            bin=${tool%%:*} formula=${tool#*:}
            PATH="$clean_path" command -v "$bin" >/dev/null && continue
            if [ -x "/opt/local/bin/$bin" ]; then
              ln -sf "/opt/local/bin/$bin" "$tools/$bin"
            else
              HOMEBREW_NO_AUTO_UPDATE=1 brew install "$formula"
            fi
          done
          echo "$tools" >> "$GITHUB_PATH"

      # As in build-desktop: the Rust build stays on the self-hosted Mac.
      - name: Keep Rust builds on the self-hosted Mac
        if: runner.environment == 'self-hosted'
        run: |
          # -2: build scripts in the first folder remembered MacPorts' libz.
          keep="$RUNNER_TOOL_CACHE/reachercm-target-2"
          mkdir -p "$keep"
          rm -rf src-tauri/target
          ln -s "$keep" src-tauri/target

      - run: |
          npm ci
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Build an unsigned iOS IPA
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          # CFBundleVersion: the dev number, or 1000 for a stable release so
          # it sorts after that version's dev builds. scripts/ios-source.mjs
          # derives the same number from the tag for apps.json.
          if [[ "$VERSION" == *-dev.* ]]; then BUILD_NUMBER="${VERSION##*.}"; else BUILD_NUMBER=1000; fi
          ./scripts/ios-init.sh
          npx tauri ios build --ci --target aarch64 --no-sign \
            --config "{\"version\":\"${VERSION%-dev.*}\",\"bundle\":{\"iOS\":{\"bundleVersion\":\"$BUILD_NUMBER\"}}}"
          ipa=$(find src-tauri/gen/apple/build -type f -name '*.ipa' -print)
          test -f "$ipa"
          unzip -tq "$ipa"
          mkdir -p dist-ios
          cp "$ipa" "dist-ios/ReacherCM_${VERSION}_ios_arm64_unsigned.ipa"

      - name: Upload IPA to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist-ios/*.ipa --clobber
